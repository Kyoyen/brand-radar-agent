<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Brand Radar 企划桌面方向概念</title>
  <desc id="desc">一张暖色无限画布上摆放情报便利贴、图片、竞品对比、日历和营销 Brief，左侧为基础导航。</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#D6D0C3" opacity="0.66"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#493E30" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#493E30" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7B986"/>
      <stop offset="0.46" stop-color="#B95F45"/>
      <stop offset="1" stop-color="#344D43"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" rx="36" fill="#F4F0E7"/>
  <rect x="248" width="1352" height="900" fill="url(#dots)"/>

  <rect x="0" y="0" width="248" height="900" rx="36" fill="#242A26"/>
  <text x="42" y="72" fill="#F6F1E7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="700" letter-spacing="2">BRAND RADAR</text>
  <text x="42" y="106" fill="#AEB7AE" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">你的营销企划桌面</text>

  <rect x="26" y="154" width="196" height="52" rx="15" fill="#F0C96B"/>
  <circle cx="54" cy="180" r="10" fill="#242A26"/>
  <path d="M49 180h10M54 175v10" stroke="#F0C96B" stroke-width="2.4" stroke-linecap="round"/>
  <text x="78" y="186" fill="#242A26" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="650">新建 Radar</text>

  <g fill="#D7DDD7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="17">
    <text x="48" y="263">历史</text>
    <text x="48" y="318">品牌档案</text>
    <text x="48" y="373">设置</text>
  </g>
  <g stroke="#758078" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M28 253h12v12H28zM31 248h7"/>
    <path d="M29 304h11v15H29zM32 304v-4h5v4"/>
    <circle cx="34" cy="367" r="7"/><path d="M34 356v4M34 374v4M23 367h4M41 367h4"/>
  </g>

  <rect x="24" y="768" width="200" height="96" rx="18" fill="#303833" stroke="#465048"/>
  <circle cx="52" cy="800" r="12" fill="#88AF96"/>
  <text x="76" y="806" fill="#F4F0E7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="650">品牌档案已启用</text>
  <text x="42" y="837" fill="#AEB7AE" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">可随时更新 · 默认模式可用</text>

  <text x="302" y="66" fill="#27302B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="28" font-weight="720">下周咖啡企划</text>
  <text x="302" y="96" fill="#6D756E" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">全国 + 上海 · 9 月 7 日—13 日</text>
  <rect x="1372" y="42" width="174" height="44" rx="22" fill="#FFF8E8" stroke="#D7CBAE"/>
  <text x="1411" y="70" fill="#7B5B2D" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" letter-spacing="1">CONCEPT / NEXT</text>

  <g transform="translate(310 155) rotate(-2 150 100)" filter="url(#shadow)">
    <rect width="306" height="205" rx="7" fill="#F7D87A"/>
    <rect x="123" y="-9" width="62" height="20" rx="4" fill="#E7C056" opacity="0.78"/>
    <text x="28" y="46" fill="#4A3E23" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" letter-spacing="1">信息还不够</text>
    <text x="28" y="82" fill="#29271F" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="24" font-weight="760">上海咖啡快闪</text>
    <text x="28" y="116" fill="#4E493B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">可能是下周机会，但主办方、</text>
    <text x="28" y="141" fill="#4E493B" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">地址和公开报名页尚未确认。</text>
    <path d="M28 169h250" stroke="#C6A846"/>
    <text x="28" y="190" fill="#6D5A25" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13">先补公开来源，再决定是否进入方案</text>
  </g>

  <g transform="translate(675 128) rotate(1.2 215 140)" filter="url(#shadow)">
    <rect width="430" height="286" rx="24" fill="#FFFDF8"/>
    <rect x="18" y="18" width="394" height="150" rx="17" fill="url(#photo)"/>
    <circle cx="338" cy="91" r="36" fill="#F6D37C" opacity="0.9"/>
    <path d="M0 156C90 105 150 125 216 88C290 46 345 70 430 27V168H0Z" fill="#263E36" opacity="0.63"/>
    <text x="30" y="203" fill="#2A302D" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">CAMPAIGN REFERENCE</text>
    <text x="30" y="235" fill="#202622" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="760">城市夜游 × 咖啡消费场景</text>
    <text x="30" y="264" fill="#70766F" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">图片用于识别内容方向 · 来源与许可随卡片保存</text>
  </g>

  <g transform="translate(1160 155) rotate(2 170 104)" filter="url(#shadow)">
    <rect width="338" height="210" rx="8" fill="#F3B9AF"/>
    <text x="26" y="42" fill="#763F38" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" letter-spacing="1">BRIEF 01</text>
    <text x="26" y="80" fill="#372724" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="760">把“夜游”变成</text>
    <text x="26" y="108" fill="#372724" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="22" font-weight="760">下班后的第三空间</text>
    <text x="26" y="145" fill="#654641" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">人群：城市通勤者</text>
    <text x="26" y="170" fill="#654641" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15">还缺：门店与活动窗口确认</text>
  </g>

  <path d="M575 388C640 440 709 436 760 414" stroke="#9A8F7B" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 10" fill="none"/>
  <path d="M1080 403C1150 430 1196 420 1245 384" stroke="#9A8F7B" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 10" fill="none"/>

  <g transform="translate(332 485)" filter="url(#soft)">
    <rect width="395" height="250" rx="22" fill="#FFFDF8" stroke="#D9D2C5"/>
    <text x="28" y="45" fill="#202622" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="760">30 DAYS · 关键节点</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">
      <rect x="28" y="72" width="66" height="66" rx="14" fill="#E1EADF"/>
      <text x="50" y="98" fill="#607463" font-size="12" font-weight="700">SEP</text>
      <text x="51" y="127" fill="#2F4433" font-size="26" font-weight="800">10</text>
      <text x="116" y="96" fill="#202622" font-size="18" font-weight="700">教师节</text>
      <text x="116" y="123" fill="#70766F" font-size="14">品牌表达需避免泛化借势</text>
      <rect x="28" y="158" width="66" height="66" rx="14" fill="#F6E7BA"/>
      <text x="50" y="184" fill="#8B6D28" font-size="12" font-weight="700">SEP</text>
      <text x="51" y="213" fill="#5C471A" font-size="26" font-weight="800">11</text>
      <text x="116" y="182" fill="#202622" font-size="18" font-weight="700">上海线下节点</text>
      <text x="116" y="209" fill="#70766F" font-size="14">核对人流、门店和竞品占位</text>
    </g>
  </g>

  <g transform="translate(785 490)" filter="url(#soft)">
    <rect width="328" height="204" rx="20" fill="#DCE9E1"/>
    <text x="26" y="42" fill="#2F4D3D" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700">竞品对比</text>
    <text x="26" y="75" fill="#20332A" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="21" font-weight="760">社区感正在升温</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14">
      <rect x="26" y="98" width="276" height="35" rx="11" fill="#F6F9F6"/>
      <text x="42" y="121" fill="#455D50">星巴克 · 兴趣社区空间</text>
      <rect x="26" y="145" width="276" height="35" rx="11" fill="#F6F9F6"/>
      <text x="42" y="168" fill="#455D50">本品牌 · 夜间场景仍有空位</text>
    </g>
  </g>

  <g transform="translate(1160 486)" filter="url(#soft)">
    <rect width="332" height="250" rx="22" fill="#2B322E"/>
    <text x="26" y="42" fill="#A8B6AD" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700">AGENT · 正在工作</text>
    <circle cx="39" cy="81" r="7" fill="#F0C96B"/>
    <text x="58" y="87" fill="#F4F0E7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">核对旅游节当前版本</text>
    <circle cx="39" cy="125" r="7" fill="#89AD95"/>
    <text x="58" y="131" fill="#F4F0E7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">比较竞品证据</text>
    <circle cx="39" cy="169" r="7" fill="#6B746E"/>
    <text x="58" y="175" fill="#A8B6AD" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">生成企划卡片</text>
    <rect x="24" y="204" width="284" height="27" rx="13" fill="#3C4640"/>
    <rect x="24" y="204" width="192" height="27" rx="13" fill="#F0C96B"/>
  </g>

  <rect x="516" y="805" width="832" height="58" rx="22" fill="#FFFDF8" stroke="#D9D2C5" filter="url(#soft)"/>
  <text x="550" y="841" fill="#788079" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16">问 Agent、补充材料，或让它把选中的卡片整理成新的 Brief…</text>
  <circle cx="1308" cy="834" r="18" fill="#27302B"/>
  <path d="M1301 834h14M1308 827v14" stroke="#F4F0E7" stroke-width="2.4" stroke-linecap="round"/>
</svg>
